version: '3.8'
services:
  db:
    image: postgres:15
    container_name: ota_postgres
    environment:
      POSTGRES_USER: ota_admin
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: ota_database
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: