<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mertani OTA - Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="file"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { resize: vertical; height: 80px; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #responseMessage { margin-top: 20px; padding: 10px; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>Upload Firmware OTA</h2>
    <form id="uploadForm">
        <div class="form-group">
            <label for="firmware">File Firmware (.bin):</label>
            <input type="file" id="firmware" name="firmware" accept=".bin" required>
        </div>
        <div class="form-group">
            <label for="version">Versi Firmware (contoh: 1.0.1):</label>
            <input type="text" id="version" name="version" placeholder="1.0.0" required>
        </div>
        <div class="form-group">
            <label for="hardware_target">Hardware Target (contoh: STM32G0B1):</label>
            <input type="text" id="hardware_target" name="hardware_target" placeholder="STM32G0B1" required>
        </div>
        <div class="form-group">
            <label for="release_notes">Catatan Rilis (Release Notes):</label>
            <textarea id="release_notes" name="release_notes" placeholder="Deskripsi pembaruan..."></textarea>
        </div>
        <button type="submit">Unggah Firmware</button>
    </form>
    <div id="responseMessage"></div>
</div>

<script>
    const form = document.getElementById('uploadForm');
    const responseMessage = document.getElementById('responseMessage');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData(form);
        responseMessage.style.display = 'block';
        responseMessage.className = '';
        responseMessage.textContent = 'Mengunggah file...';

        try {
            const response = await fetch('/api/admin/upload', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (response.ok) {
                responseMessage.className = 'success';
                responseMessage.innerHTML = `<strong>Berhasil!</strong><br>ID: ${result.data.id}<br>Checksum: ${result.data.checksum.substring(0, 16)}...`;
                form.reset();
            } else {
                responseMessage.className = 'error';
                responseMessage.textContent = `Gagal: ${result.error || 'Terjadi kesalahan'}`;
            }
        } catch (err) {
            responseMessage.className = 'error';
            responseMessage.textContent = 'Gagal terhubung ke server.';
        }
    });
</script>

</body>
</html>
