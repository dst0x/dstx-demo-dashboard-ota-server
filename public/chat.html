<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asisten Mertani · OTA</title>
    <link rel="stylesheet" href="/navigation.css">
    <style>
        :root {
            --primary: #ea580c;
            --primary-hover: #c2410c;
            --primary-light: #fff7ed;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --bg: #f8fafc;
            --bubble-user: #ea580c;
            --bubble-bot: #fff;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; }

        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 24px; border-bottom: 1px solid var(--border);
            background: #fff; flex-shrink: 0;
        }
        header h1 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        header h1 span { color: var(--primary); }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .btn-logout { padding: 6px 14px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--text); }
        .btn-logout:hover { border-color: #fdba74; color: var(--primary-hover); }

        /* Layout */
        .chat-layout { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar */
        .sidebar {
            width: 240px; flex-shrink: 0; border-right: 1px solid var(--border);
            background: #fff; display: flex; flex-direction: column; overflow-y: auto;
        }
        .sidebar-section { padding: 14px 16px 8px; }
        .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
        .topic-btn {
            display: flex; align-items: center; gap: 8px; width: 100%;
            padding: 8px 10px; border-radius: 8px; border: none; background: none;
            font-size: 12px; font-weight: 500; color: var(--text); cursor: pointer; text-align: left;
        }
        .topic-btn:hover { background: var(--primary-light); color: var(--primary); }
        .topic-btn svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--muted); }
        .topic-btn:hover svg { color: var(--primary); }
        .sidebar-divider { height: 1px; background: var(--border); margin: 8px 16px; }

        /* Chat area */
        .chat-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        #messages {
            flex: 1; overflow-y: auto; padding: 24px 20px;
            display: flex; flex-direction: column; gap: 16px;
        }

        /* Welcome */
        .welcome {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; flex: 1; text-align: center; padding: 40px 20px; color: var(--muted);
        }
        .welcome-icon { width: 56px; height: 56px; border-radius: 16px; background: var(--primary-light); display: flex; align-items: center; justify-content: center; }
        .welcome-icon svg { width: 28px; height: 28px; color: var(--primary); }
        .welcome h2 { margin: 0; font-size: 18px; color: var(--text); }
        .welcome p { margin: 0; font-size: 13px; max-width: 320px; line-height: 1.6; }
        .quick-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px; }
        .chip {
            padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border);
            font-size: 12px; font-weight: 500; cursor: pointer; background: #fff; color: var(--text);
            transition: all .15s;
        }
        .chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

        /* Bubbles */
        .msg { display: flex; gap: 10px; max-width: 75%; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.bot { align-self: flex-start; }
        .avatar {
            width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 13px;
        }
        .msg.bot .avatar { background: var(--primary-light); }
        .msg.bot .avatar svg { width: 16px; height: 16px; color: var(--primary); }
        .msg.user .avatar { background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; }
        .bubble {
            padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.6;
            white-space: pre-wrap; word-break: break-word;
        }
        .msg.bot .bubble { background: var(--bubble-bot); border: 1px solid var(--border); border-top-left-radius: 4px; }
        .msg.user .bubble { background: var(--bubble-user); color: #fff; border-top-right-radius: 4px; }
        .bubble ul { margin: 6px 0 0; padding-left: 18px; }
        .bubble ul li { margin-bottom: 3px; }
        .bubble strong { font-weight: 700; }
        .typing { display: flex; gap: 4px; align-items: center; padding: 12px 16px; }
        .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
        .typing span:nth-child(2) { animation-delay: .2s; }
        .typing span:nth-child(3) { animation-delay: .4s; }
        @keyframes bounce { 0%,80%,100%{transform:scale(1)} 40%{transform:scale(1.4)} }

        /* Input */
        .input-wrap {
            padding: 14px 20px 16px; border-top: 1px solid var(--border); background: #fff; flex-shrink: 0;
        }
        .input-row { display: flex; gap: 10px; align-items: flex-end; }
        #userInput {
            flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px;
            font-size: 13px; font-family: inherit; resize: none; outline: none;
            max-height: 120px; line-height: 1.5; background: var(--bg);
        }
        #userInput:focus { border-color: var(--primary); background: #fff; }
        .send-btn {
            width: 38px; height: 38px; border-radius: 10px; border: none; cursor: pointer;
            background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: background .15s;
        }
        .send-btn:hover { background: var(--primary-hover); }
        .send-btn svg { width: 16px; height: 16px; }
        .input-hint { font-size: 10px; color: var(--muted); margin-top: 6px; text-align: center; }

        @media (max-width: 600px) {
            .sidebar { display: none; }
            .msg { max-width: 90%; }
        }
    </style>
</head>
<body>

<header>
    <h1>
        <img src="/logo.png" width="40" height="40" alt="Mertani" style="flex-shrink:0;object-fit:contain;">
        Asisten <span>Mertani</span>
    </h1>
    <div class="header-actions">
        <form method="post" action="/api/auth/logout">
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</header>

<div class="chat-layout">

    <!-- Sidebar topik -->
    <aside class="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-title">Topik Umum</div>
            <button class="topic-btn" onclick="askTopic('Apa itu Mertani Datalogger?')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                Tentang Produk
            </button>
            <button class="topic-btn" onclick="askTopic('Bagaimana cara melakukan OTA update firmware?')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Update Firmware
            </button>
            <button class="topic-btn" onclick="askTopic('Bagaimana cara membaca sensor via Modbus?')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="6" height="14" rx="2"/><rect x="16" y="5" width="6" height="14" rx="2"/><path d="M8 9h8m-3-3 3 3-3 3"/></svg>
                Modbus & Sensor
            </button>
            <button class="topic-btn" onclick="askTopic('Bagaimana cara melihat log serial device?')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3M12.5 15H17"/></svg>
                Serial Monitor
            </button>
        </div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-section">
            <div class="sidebar-title">Kendala & Solusi</div>
            <button class="topic-btn" onclick="askTopic('Device tidak terdeteksi atau tidak muncul di dashboard')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                Device Tidak Muncul
            </button>
            <button class="topic-btn" onclick="askTopic('OTA update gagal atau tidak mau download firmware')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>
                OTA Gagal
            </button>
            <button class="topic-btn" onclick="askTopic('Pembacaan sensor salah atau tidak akurat')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                Sensor Tidak Akurat
            </button>
            <button class="topic-btn" onclick="askTopic('Koneksi WiFi ESP32 sering putus')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
                Koneksi WiFi
            </button>
        </div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-section">
            <div class="sidebar-title">Lainnya</div>
            <button class="topic-btn" onclick="clearChat()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                Bersihkan Chat
            </button>
        </div>
    </aside>

    <!-- Chat utama -->
    <div class="chat-main">
        <div id="messages">
            <div class="welcome" id="welcome">
                <div class="welcome-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </div>
                <h2>Halo! Ada yang bisa dibantu?</h2>
                <p>Tanyakan seputar produk Mertani, cara penggunaan, kendala teknis, atau solusi yang kamu butuhkan.</p>
                <div class="quick-chips">
                    <button class="chip" onclick="askTopic('Apa itu Mertani Datalogger?')">Tentang Mertani</button>
                    <button class="chip" onclick="askTopic('Cara upload firmware OTA')">Upload Firmware</button>
                    <button class="chip" onclick="askTopic('Cara baca sensor Modbus')">Baca Sensor</button>
                    <button class="chip" onclick="askTopic('Device tidak terdeteksi')">Device Offline</button>
                    <button class="chip" onclick="askTopic('Format frame Modbus RTU')">Frame Modbus</button>
                </div>
            </div>
        </div>

        <div class="input-wrap">
            <div class="input-row">
                <textarea id="userInput" rows="1" placeholder="Ketik pertanyaan kamu di sini…" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()" title="Kirim">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2 15 22l-4-9-9-4 20-7z"/></svg>
                </button>
            </div>
            <div class="input-hint">Tekan Enter untuk kirim · Shift+Enter untuk baris baru</div>
        </div>
    </div>
</div>

<nav class="mac-dock" aria-label="Navigasi utama">
    <a class="dock-item active" href="/chat" aria-current="page" aria-label="Asisten Chat">
        <span class="dock-label">Asisten</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
    </a>
    <a class="dock-item" href="/" aria-label="Dashboard OTA">
        <span class="dock-label">Dashboard OTA</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/>
            <rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
        </svg>
    </a>
    <a class="dock-item" href="/monitor" aria-label="Serial Monitor">
        <span class="dock-label">Serial Monitor</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="3"/>
            <path d="m7 9 3 3-3 3M12.5 15H17"/>
        </svg>
    </a>
    <a class="dock-item" href="/modbus" aria-label="Modbus Terminal">
        <span class="dock-label">Modbus Terminal</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="2" y="5" width="6" height="14" rx="2"/><rect x="16" y="5" width="6" height="14" rx="2"/>
            <path d="M8 9h8m-3-3 3 3-3 3M16 15H8m3-3-3 3 3 3"/><path d="M4.5 8h1M18.5 16h1"/>
        </svg>
    </a>
</nav>

<script>
// ── State ───────────────────────────────────────────────────
let hasMessages = false;
let isStreaming = false;
const history = []; // { role, content }

function hideWelcome() {
    if (!hasMessages) {
        const w = document.getElementById('welcome');
        if (w) w.style.display = 'none';
        hasMessages = true;
    }
}

// ── Render ──────────────────────────────────────────────────
function appendMsg(role, text) {
    hideWelcome();
    const wrap = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    if (role === 'bot') {
        avatar.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
    } else {
        avatar.textContent = 'Kamu';
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    div.appendChild(avatar);
    div.appendChild(bubble);
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
    return bubble;
}

function showTyping() {
    hideWelcome();
    const wrap = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typing-indicator';
    div.innerHTML = `
        <div class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
}

function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
}

function setInputDisabled(v) {
    document.getElementById('userInput').disabled = v;
    document.querySelector('.send-btn').disabled = v;
    isStreaming = v;
}

// ── DeepSeek streaming ──────────────────────────────────────
async function botReply(userText) {
    history.push({ role: 'user', content: userText });
    showTyping();
    setInputDisabled(true);

    try {
        const res = await fetch('/api/admin/chat/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: history }),
        });

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            removeTyping();
            appendMsg('bot', '⚠️ ' + (err.error || `Error ${res.status}`));
            setInputDisabled(false);
            return;
        }

        removeTyping();
        const bubble = appendMsg('bot', '');
        let full = '';

        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const lines = buf.split('\n');
            buf = lines.pop();

            for (const line of lines) {
                const t = line.trim();
                if (t.startsWith('data: ')) {
                    try {
                        const { delta } = JSON.parse(t.slice(6));
                        if (delta) { full += delta; bubble.textContent = full; }
                    } catch (_) {}
                } else if (t.startsWith('event: error')) {
                    // next line has data
                }
                const wrap = document.getElementById('messages');
                wrap.scrollTop = wrap.scrollHeight;
            }
        }

        if (full) history.push({ role: 'assistant', content: full });
    } catch (err) {
        removeTyping();
        appendMsg('bot', '⚠️ Gagal menghubungi server: ' + err.message);
    }

    setInputDisabled(false);
    document.getElementById('userInput').focus();
}

function sendMessage() {
    if (isStreaming) return;
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = '';
    appendMsg('user', text);
    botReply(text);
}

function askTopic(text) {
    if (isStreaming) return;
    appendMsg('user', text);
    botReply(text);
}

function clearChat() {
    if (isStreaming) return;
    history.length = 0;
    const wrap = document.getElementById('messages');
    wrap.innerHTML = '';
    hasMessages = false;
    const welcome = document.createElement('div');
    welcome.className = 'welcome';
    welcome.id = 'welcome';
    welcome.innerHTML = `
        <div class="welcome-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <h2>Halo! Ada yang bisa dibantu?</h2>
        <p>Tanyakan seputar produk Mertani, cara penggunaan, kendala teknis, atau solusi yang kamu butuhkan.</p>
        <div class="quick-chips">
            <button class="chip" onclick="askTopic('Apa itu Mertani Datalogger?')">Tentang Mertani</button>
            <button class="chip" onclick="askTopic('Cara upload firmware OTA')">Upload Firmware</button>
            <button class="chip" onclick="askTopic('Cara baca sensor Modbus')">Baca Sensor</button>
            <button class="chip" onclick="askTopic('Device tidak terdeteksi')">Device Offline</button>
            <button class="chip" onclick="askTopic('Format frame Modbus RTU')">Frame Modbus</button>
        </div>`;
    wrap.appendChild(welcome);
}

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
</script>
</body>
</html>
